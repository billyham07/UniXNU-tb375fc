schema_version = 2

# Lenovo TB375FC (MT6897 / MT8792), UniXNU route (docs/roadmap.md M5).
# Layout from UniXNU-tb365fc (MT6835, same vendor/LK boot path); OS profile and bootstrap
# pass from UniXNU-uke / UniXNU-sheng (iPadOS 27.0.1, xnu-12377, arm64e).

[board]
name = "tb375fc"
soc = "MT6897"
soc_source = "mt6897"
os_profile = "ipados-27.0.1-24A446"
description = "Lenovo TB375FC (MT6897 / MT8792)"
kit = "tb375fc"

[components]
# Bootstrap set: the kernel boots on DT/PSCI/GIC/timer and draws on the GOP framebuffer.
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer"]

[kernel]
defconfig = "bootstrap_defconfig"
# Generic archives of the 27.0.1 kernels (UniXNU-sheng / UniXNU-uke): the source corecrypto provider
# (ArmCpu requires it), the platform/CPU components and the kernel libpthread. No device display yet.
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform",
            "component:ArmCpu", "build-libpthread-kernel.py",
            # the RELEASE comparison kernel XnuPrelink reads (last, as in UniXNU-sheng)
            "build-tb375fc-stubs.py", "build-tb375fc-storage.py",
            "build-fileset-release-reference.py --tree . --lto"]
config_fragments = ["arch:configs/common.config", "soc:configs/mt6897.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu-12377/series"]

[device_tree]
source = "device:dts/tb375fc.dts"
include_dirs = ["soc:dts"]

[firmware]
# Built by bin/tb375fc-uefi-build.sh (tb375fcPkg is regenerated by bin/tb375fc-uefi-port.py).
config = "tb375fc"
dsc = "Platforms/Lenovo/tb375fcPkg/tb375fc.dsc"
fd = "Build/tb375fcPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"

[firmware.defines]
DEVICE_MODEL = "TB375FC"

[payload]
volume = "TB375FC"
size_mib = 192
loader = "firmware"
title = "UniXNU"
# use_contiguous_hint=0 (as UniXNU-sheng/uke/j716f): with the hint, arm_vm_prot_finalize in
# machine_lockdown hits the arm_vm_init.c:1107 hint assertion on this board (devloop 20261108T163208Z).
kernel_args = ["-v", "serial=3", "debug=0x14e", "-enable_kprintf_spam", "use_contiguous_hint=0"]

[payload.adt]
# A software identity seed for this board, not an Apple chip ID.
chip_id = "0x375FC"
unique_chip_id = "required"
owned_memory_size = "0x40000000"
psci_method = "smc"

[adt.defaults.u32]
# No Apple PMGR or SEP: report a virtual platform, so AMFI does not wait for an ApplePMGRNub
# (as UniXNU-sheng/uke 24A446). Without it: "AMFI: No PMGR?" @ConfigurationSettings.cpp:392
# right after dlil_init (devloop 20261108T165326Z).
"vmm-present" = 1

[adt.chosen.u32]
# No CTRR on MT6897: kernel text stays writable by hardware, which XNU must be told (iBoot writes this
# on Apple SoCs; as UniXNU-sheng). Without it: machine_routines.c:3379 "_unsafe_kernel_text_initialized"
# at bsd_autoconf (devloop 20261108T170530Z).
"kernel-ctrr-to-be-enabled" = 0

[kernel.prelink]
# Bootstrap: the 27.0.1 regression policy requires native branches that only the sheng display/HID
# components provide (IOMobileFramebufferLegacy, IOHIDDevice::handleOpen). Not on this board yet.
regression_policy = ""
