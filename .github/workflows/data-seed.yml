name: TB375FC Data seed

# First-install Data seed for the full iPadOS 27 system (framework scripts/make-data-seed.py):
# an APFS Data volume with the OS image's /private/var skeleton, packed for DarwinBoot.
# It contains files copied from Apple's OS image, so only a recipient-encrypted copy leaves the runner.

on:
  workflow_dispatch:
    inputs:
      gib:
        description: Nominal Data size in GiB (sparse; only written pages use memory)
        default: "3"

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  UNIXNU_DEVICE: ${{ github.workspace }}/device
  DEFCONFIG: bootstrap_defconfig
  FRAMEWORK_REVISION: 5dc00d201496a1e7a72d1f5db23f041eb94ace1c

defaults:
  run:
    shell: bash

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out public device sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: device
          persist-credentials: false

      - name: Check out pinned public UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniXNU/UniXNU
          ref: ${{ env.FRAMEWORK_REVISION }}
          path: framework
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install openssl@3 blacktop/tap/ipsw
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Prepare the framework
        working-directory: framework
        run: |
          test "$(cat ../device/ci/framework-revision)" = "$FRAMEWORK_REVISION"
          git apply ../device/patches/framework/prepare-xnu-source.patch
          git submodule update --init --depth 1 drivers/DarwinBoot
          ./unixnu defconfig "$DEFCONFIG"

      - name: Build the Data seed
        id: seed
        working-directory: framework
        env:
          GIB: ${{ inputs.gib }}
        run: |
          ./unixnu ipsw fetch OS
          python3 - "$RUNNER_TEMP/os-image-path" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import decrypt_aea
          aea = next(Path('out/ipsw/24A446').glob('*.dmg.aea'), None)
          if aea is None:
              raise SystemExit('OS AEA not fetched')
          Path(sys.argv[1]).write_text(str(Path(decrypt_aea(aea)).resolve()))
          PY
          image=$(cat "$RUNNER_TEMP/os-image-path")
          ls -la "$image"
          mkdir -p "$RUNNER_TEMP/os" "$RUNNER_TEMP/seed"
          hdiutil attach -readonly -nobrowse -noverify -owners on -mountpoint "$RUNNER_TEMP/os" "$image"
          python3 scripts/make-data-seed.py "$RUNNER_TEMP/os" "$RUNNER_TEMP/seed/data.dbr" \
            --gib "$GIB" --build 24A446 --skip-setup
          hdiutil detach "$RUNNER_TEMP/os"
          uuid=$(python3 - "$RUNNER_TEMP/seed/data.dbr" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from unixnu.runtime import seed_uuid
          print(seed_uuid(Path('.').resolve(), Path(sys.argv[1])))
          PY
          )
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/seed"

      - name: Encrypt the seed for the operator
        env:
          UUID: ${{ steps.seed.outputs.uuid }}
        run: |
          mkdir -p "$RUNNER_TEMP/sealed"
          cd "$RUNNER_TEMP/seed"
          shasum -a 256 data.dbr > data.dbr.sha256
          tar -czf "$RUNNER_TEMP/seed.tar.gz" data.dbr data.dbr.sha256
          "$OPENSSL" cms -encrypt -binary -aes-256-gcm -in "$RUNNER_TEMP/seed.tar.gz" \
            -out "$RUNNER_TEMP/sealed/seed.tar.gz.cms" -outform DER \
            -recip "$GITHUB_WORKSPACE/device/ci/recipient.pem" \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
          python3 - <<PY
          import hashlib, json, os
          from pathlib import Path
          sealed = Path(os.environ['RUNNER_TEMP']) / 'sealed'
          c = (sealed / 'seed.tar.gz.cms').read_bytes()
          json.dump(dict(GITHUB_REPOSITORY=os.environ['GITHUB_REPOSITORY'], GITHUB_SHA=os.environ['GITHUB_SHA'],
                         GITHUB_RUN_ID=os.environ['GITHUB_RUN_ID'], GITHUB_RUN_ATTEMPT=os.environ['GITHUB_RUN_ATTEMPT'],
                         data_volume_uuid=os.environ['UUID'], ciphertext_sha256=hashlib.sha256(c).hexdigest()),
                    open(sealed / 'manifest.json', 'w'), indent=2)
          PY
          cat "$RUNNER_TEMP/sealed/manifest.json"

      - name: Upload recipient-encrypted seed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-seed-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sealed/seed.tar.gz.cms
            ${{ runner.temp }}/sealed/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## TB375FC Data seed: ${{ steps.seed.outcome }} (volume ${{ steps.seed.outputs.uuid }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Only the recipient-encrypted seed is uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove proprietary and plaintext inputs
        if: always()
        run: rm -rf framework/out "$RUNNER_TEMP/seed" "$RUNNER_TEMP/seed.tar.gz" "$RUNNER_TEMP/os"
